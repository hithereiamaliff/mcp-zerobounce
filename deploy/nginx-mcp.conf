# Nginx location block for the ZeroBounce MCP Server
# Add inside the existing `server { ... }` block for mcp.techmavie.digital:
#   sudo nano /etc/nginx/sites-available/mcp.techmavie.digital
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public URLs:
#   https://mcp.techmavie.digital/zerobounce/mcp/usr_...        (hosted, recommended)
#   https://mcp.techmavie.digital/zerobounce/health
#   https://mcp.techmavie.digital/zerobounce/analytics/dashboard
#
# CORS is handled by the Express app. Do NOT add CORS headers here, or browsers
# will see duplicate Access-Control-Allow-Origin headers.

location /zerobounce/ {
    # Trailing slash strips the /zerobounce prefix before proxying.
    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Batch validation and result downloads can take up to ~2 minutes.
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 300s;

    # Stream responses straight through; don't buffer uploads.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    # Bulk uploads can be sent inline as CSV text (app limit: 10 MB).
    client_max_body_size 12M;

    # Keep usr_ keys out of the access log (they appear in /zerobounce/mcp/usr_... URLs).
    # Note: nginx's error_log still records the request line when the upstream is
    # unreachable or times out. Clients that support custom headers can send
    # "Authorization: Bearer usr_..." to POST /zerobounce/mcp so keys never appear in URLs.
    access_log off;
}
